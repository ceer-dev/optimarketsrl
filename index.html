<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OPTIMARKET S.R.L. — Panel para Clientes</title>
    <meta name="description" content="Catálogo, precios facturados y pedidos de OPTIMARKET S.R.L. para ópticas." />
    <meta name="theme-color" content="#07090c" />
    <link rel="icon" type="image/svg+xml" href="images/optimarket_eye_logo.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="images/favicon-192x192.png" />

    <!-- Imágenes del catálogo: servidor de Google (conectar antes ahorra tiempo en celulares) -->
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" />
    <link rel="stylesheet" href="css/panel.css?v=20261008l" />

    <script>
      // Sin identificación → al acceso (antes de pintar nada)
      try { if (!localStorage.getItem("registeredClient")) { document.documentElement.style.display = "none"; location.replace("form.html"); } } catch (_) {}
    </script>
  </head>
  <body>
    <!-- Formularios ocultos para Netlify Forms (detección en el despliegue) -->
    <form name="pedidos" data-netlify="true" hidden>
      <input type="text" name="optica" /><input type="text" name="celular" /><textarea name="detalles"></textarea>
      <input type="text" name="metodo_pago" /><input type="text" name="total" /><input type="text" name="fecha_hora" />
    </form>
    <form name="visitas" data-netlify="true" hidden>
      <input type="text" name="optica" /><input type="text" name="fecha_hora" />
    </form>

    <header class="cabecera">
      <a class="cabecera-logo" href="#/" aria-label="Inicio del catálogo">
        <img src="images/optimarket_logo_mejorado.svg" alt="OPTIMARKET S.R.L." width="150" height="26" />
      </a>
      <div class="cabecera-cliente">
        <span class="etiqueta-panel"><span class="punto"></span>Panel para Clientes</span>
        <span id="nombreOptica" class="nombre-optica"></span>
      </div>
      <a href="#/pedido" class="boton-carrito" aria-label="Ver mi pedido">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM7.2 14h9.9c.8 0 1.4-.4 1.7-1.1L22 6H5.2L4.3 4H1v2h2l3.6 7.6-1.4 2.5C4.5 17.4 5.5 19 7 19h12v-2H7l1.2-3Z"/></svg>
        <span id="contadorCarrito" class="contador" hidden>0</span>
      </a>
      <button type="button" id="botonSalir" class="boton-icono" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3h9Zm4-10h-9a2 2 0 0 0-2 2v4h2V5h9v14h-9v-4H9v4a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg>
      </button>
    </header>

    <main id="vista" class="vista" tabindex="-1" aria-live="polite">
      <div class="cargando"><span class="girando"></span> Cargando catálogo…</div>
    </main>

    <!-- Barra inferior: lo elegido y el total (siempre a mano, sin salir de la subcategoría) -->
    <div id="barraPedido" class="barra-pedido" hidden>
      <div class="barra-info">
        <span id="barraCantidad">0 productos</span>
        <strong id="barraTotal">Bs 0.00</strong>
      </div>
      <a href="#/pedido" class="boton boton-rojo">Ver pedido</a>
    </div>

    <div id="aviso" class="aviso" role="status" hidden></div>

    <script src="js/panel.js?v=20261008l"></script>
  </body>
</html>
