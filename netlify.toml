# Netlify Configuration for OPTIMARKET SRL
# =========================================

[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML: Always revalidate so users instantly get the latest deployment without stale cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Prices Catalog: Revalidate on every request via ETag to ensure current prices
[[headers]]
  for = "/precios.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Catálogo del Panel para Clientes (lo genera el ERP: scripts/exportar-catalogo-clientes.js).
# Siempre se revalida (ETag): al publicar un catálogo nuevo, los clientes lo ven al instante; si no cambió, no se descarga de nuevo.
[[headers]]
  for = "/catalogo/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Diccionario de búsqueda: los cambios se ven apenas se publica
[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Static Images (SVG, WebP, PNG):
# Note: Unversioned static files whose URLs do not change automatically MUST NOT
# have a 1-year immutable cache (max-age=31536000). We use must-revalidate so
# any updated logo, product image, or banner is revalidated via ETag.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# CSS and JavaScript:
# Static files with manual version query strings; revalidate with server on update.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
