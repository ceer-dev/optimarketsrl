name: Verify & Test

on:
  push:
    branches: [ main, "perf/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Catalog Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check on JavaScript Files
        run: |
          for f in js/*.js *.js; do
            if [ -f "$f" ]; then
              node --check "$f"
              echo "✓ Syntax OK: $f"
            fi
          done

      - name: Validate Precios JSON Integrity
        run: python scripts/validate_catalog.py

  e2e-test:
    name: Headless End-to-End Smoke Test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run End-to-End Smoke Test
        run: node scripts/smoke_test.js
