<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="14" />
  
  <!-- Glass Card Circle -->
  <circle cx="200" cy="150" r="80" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Glasses Icon -->
  <g transform="translate(130, 115) scale(1.4)" stroke="#cc0000" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left temple -->
    <path d="M10 25 C10 12 18 10 18 10" />
    <!-- Left lens ring -->
    <circle cx="34" cy="25" r="14" />
    <!-- Bridge -->
    <path d="M48 25 Q50 20 52 25" />
    <!-- Right lens ring -->
    <circle cx="66" cy="25" r="14" />
    <!-- Right temple -->
    <path d="M90 25 C90 12 82 10 82 10" />
  </g>
  
  <!-- Placeholder Text -->
  <text x="200" y="245" font-family="'Outfit', sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">
    Imagen no disponible
  </text>
</svg>
