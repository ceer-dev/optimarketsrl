<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OPTIMARKET Icon">
  <title>OPTIMARKET S.R.L. — Icono</title>
  <defs>
    <linearGradient id="i-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="40%" stop-color="#e8edf2"/>
      <stop offset="70%" stop-color="#9aaab8"/>
      <stop offset="100%" stop-color="#6b7a8a"/>
    </linearGradient>
    <radialGradient id="i-iris" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="30%" stop-color="#dd0000"/>
      <stop offset="70%" stop-color="#880000"/>
      <stop offset="100%" stop-color="#3d0000"/>
    </radialGradient>
    <radialGradient id="i-pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="i-white" cx="50%" cy="43%" r="60%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#a8b5c2"/>
    </radialGradient>
    <radialGradient id="i-glint" cx="32%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffffaa"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="i-lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="45%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
  </defs>

  <!-- Chrome outer rim -->
  <path d="M2,50 C14,18 34,5 50,5 C66,5 86,18 98,50 C86,82 66,95 50,95 C34,95 14,82 2,50 Z"
        fill="url(#i-chrome)" opacity="0.55"/>

  <!-- Red chrome eyelid arcs -->
  <path d="M6,50 C17,22 36,10 50,10 C64,10 83,22 94,50"
        fill="none" stroke="url(#i-lid)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M6,50 C17,78 36,90 50,90 C64,90 83,78 94,50"
        fill="none" stroke="url(#i-lid)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Sclera / eye white -->
  <path d="M6,50 C17,22 36,10 50,10 C64,10 83,22 94,50 C83,78 64,90 50,90 C36,90 17,78 6,50 Z"
        fill="url(#i-white)"/>

  <!-- Iris -->
  <circle cx="50" cy="50" r="28" fill="url(#i-iris)"/>

  <!-- Targeting rings -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#ff333320" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#cc000033" stroke-width="1"/>
  <circle cx="50" cy="50" r="15" fill="none" stroke="#ff333322" stroke-width="0.8"/>

  <!-- Crosshair -->
  <line x1="50" y1="24" x2="50" y2="76" stroke="#cc000030" stroke-width="0.9"/>
  <line x1="24" y1="50" x2="76" y2="50" stroke="#cc000030" stroke-width="0.9"/>

  <!-- Orange ring accent -->
  <circle cx="50" cy="50" r="11" fill="none" stroke="#aa330022" stroke-width="2"/>

  <!-- Pupil -->
  <circle cx="50" cy="50" r="10" fill="url(#i-pupil)"/>
  <circle cx="50" cy="50" r="6.5" fill="#0d0000" opacity="0.9"/>

  <!-- Red center dot -->
  <circle cx="50" cy="50" r="2.5" fill="#cc2200" opacity="0.85"/>

  <!-- Main glint -->
  <ellipse cx="41" cy="39" rx="7" ry="6" fill="url(#i-glint)" opacity="0.95"/>
  <!-- Secondary glint -->
  <ellipse cx="58" cy="43" rx="2.5" ry="2" fill="white" opacity="0.45"/>

  <!-- Wing accent sweeps -->
  <path d="M3,50 C7,38 14,31 21,26" fill="none" stroke="#cc0000" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M97,50 C93,38 86,31 79,26" fill="none" stroke="#cc0000" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M3,50 C7,62 14,69 21,74" fill="none" stroke="#880000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M97,50 C93,62 86,69 79,74" fill="none" stroke="#880000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
